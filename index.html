<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>林智妤(小妤) - 對話</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #dcfce7;
            --header: #166534;
            --header-text: #ffffff;
            --npc-bubble: #ffffff;
            --npc-text: #052e16;
            --user-bubble: #22c55e;
            --user-text: #ffffff;
            --send-btn: #16a34a;
            --send-btn-hover: #15803d;
            --input-bg: #f0fdf4;
        }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg); }
        #chat-container::-webkit-scrollbar { width: 0px; background: transparent; }

        .chat-bubble {
            position: relative;
            word-break: break-word;
            /* 功能1：縮小段落/換行行距 */
            line-height: 1.35;
            font-size: 13px;
        }
        /* 功能1：段落間距縮小 */
        .chat-bubble p { margin: 0; }
        .chat-bubble p + p { margin-top: 3px; }
        .chat-bubble br + br { display: none; }

        .bubble-user::after {
            content: ''; position: absolute; right: -8px; top: 12px;
            border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 10px solid var(--user-bubble);
        }
        .bubble-npc::after {
            content: ''; position: absolute; left: -8px; top: 12px;
            border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 10px solid var(--npc-bubble);
        }
        .typing-indicator span {
            display: inline-block; width: 6px; height: 6px; background-color: #9ca3af;
            border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        /* 功能1：思考中轉圈圈 */
        .think-spinner {
            width: 15px; height: 15px; border: 2px solid rgba(0,0,0,.15);
            border-top-color: var(--send-btn); border-radius: 50%;
            animation: spin .7s linear infinite; flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .think-label { font-size: 12px; color: #6b7280; }
        .chat-img { max-width: 220px; border-radius: 12px; margin-top: 6px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: zoom-in; transition: transform .12s; }
        .chat-img:hover { transform: scale(1.02); }
        @keyframes micpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .mic-recording { animation: micpulse 1s infinite; background: #ef4444 !important; }
        /* 功能4：圖片放大 lightbox */
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
        #lightbox.show { display: flex; }
        #lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
        #lightbox .close-x { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 34px; line-height: 1; font-weight: 300; cursor: pointer; }
    </style>
</head>
<body class="h-screen flex flex-col" style="background-color: var(--bg);">

    <header class="py-2 px-4 shadow-md z-10 sticky top-0" style="background-color: var(--header); color: var(--header-text);">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer hover:bg-white/10 p-1 rounded transition" onclick="showProfile()">
                <img src="https://i.ibb.co/WmTjnVS/image.png" class="w-8 h-8 rounded-full object-cover border border-white/30 shadow-sm">
                <h1 class="text-lg font-semibold">林智妤(小妤)</h1>
            </div>
            <div class="flex items-center gap-2">
                <div id="gpsStatus" onclick="showGpsDiag()" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-inner hidden cursor-pointer" title="點我看 GPS 診斷"></div>
                <button id="clearChatBtn" onclick="clearChat()" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-inner" title="清空從頭對話">🗑️ 清空</button>
                <button id="copyLogBtn" onclick="copyChatLog()" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-inner hidden" title="複製所有對話">📋 複製</button>
                <button id="exportLogBtn" onclick="exportChatLogCSV()" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-inner hidden" title="匯出對話紀錄 CSV">⬇️ 紀錄</button>
                <button id="ttsToggle" onclick="toggleTTS()" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-inner hidden" title="開關語音朗讀">🔊 語音</button>
                <div id="turnsDisplay" class="text-xs font-medium bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm shadow-inner tracking-wider">讀取中...</div>
            </div>
        </div>
        <!-- 功能3：版權聲明橫列於標題欄 -->
        <div class="text-center text-[10px] leading-none mt-1" style="color: var(--header-text); opacity:.55;">(C) 台科大迷你教育遊戲團隊 NTUSTMEG 2026</div>
    </header>

    <!-- Profile Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/60 hidden flex-col items-center justify-center z-50 p-4 transition-opacity opacity-0 backdrop-blur-sm" onclick="hideProfile()">
        <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="h-24 relative" style="background: linear-gradient(to right, var(--header), var(--send-btn));">
                <img src="https://i.ibb.co/WmTjnVS/image.png" class="w-20 h-20 rounded-full object-cover border-4 border-white absolute -bottom-10 left-1/2 transform -translate-x-1/2 shadow-lg bg-white">
            </div>
            <div class="pt-14 pb-6 px-6 text-center">
                <h2 class="text-xl font-bold text-gray-800 mb-3">林智妤(小妤)</h2>
                <div class="bg-gray-50 p-4 rounded-xl shadow-inner border border-gray-100">
                    <p id="profileBio" class="text-gray-600 text-sm whitespace-pre-wrap leading-relaxed text-left"></p>
                </div>
                <button onclick="hideProfile()" class="mt-6 w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 rounded-xl transition-colors shadow-sm">關閉</button>
            </div>
        </div>
    </div>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20"></main>

    <footer class="px-4 py-3 flex items-end gap-2 fixed bottom-0 w-full shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-t border-gray-200" style="background-color: var(--npc-bubble);">
        <button id="micBtn" class="p-2.5 text-white rounded-full mb-0.5 flex-shrink-0 hidden hover:opacity-90 transition shadow-sm" style="background-color: var(--send-btn);" title="語音輸入">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd" /></svg>
        </button>
        <textarea id="userInput" rows="1" class="flex-1 rounded-2xl px-4 py-2.5 text-[15px] outline-none max-h-24 resize-none transition-all" style="background-color: var(--input-bg); color: var(--npc-text);" placeholder="輸入訊息..."></textarea>
        <button id="sendBtn" class="p-2.5 text-white rounded-full mb-0.5 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed hover:opacity-90 transition shadow-sm" style="background-color: var(--send-btn);">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform -rotate-45 relative top-[-1px] left-[1px]" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
            </svg>
        </button>
    </footer>

    <!-- 功能4：圖片放大 lightbox -->
    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-x" onclick="closeLightbox()">&times;</span>
        <img id="lightboxImg" src="" alt="放大圖片" onclick="event.stopPropagation()">
    </div>

    <div id="errorModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">發生錯誤</h3>
            <p id="errorMsg" class="text-sm text-gray-500 mb-6"></p>
            <button onclick="document.getElementById('errorModal').classList.add('hidden'); document.getElementById('errorModal').classList.remove('flex');" class="w-full bg-red-600 text-white rounded-lg px-4 py-2 hover:bg-red-700 transition-colors">我知道了</button>
        </div>
    </div>

        let CONFIG;
        try {
            const binString = atob(encodedConfig);
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            CONFIG = JSON.parse(new TextDecoder().decode(bytes));
        } catch(e) { console.error("設定檔解析失敗", e); }

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // 功能1/問題2：把「思考回應中」做成動態氣泡，接在最後一句話的位置
        let loadingEl = null;
        function showLoading() {
            if (loadingEl) return;
            loadingEl = document.createElement('div');
            loadingEl.className = 'flex items-start gap-2 mb-3';
            loadingEl.innerHTML =
                '<img src="' + CONFIG.npcAvatar + '" class="w-10 h-10 rounded-full object-cover cursor-pointer" onclick="showProfile()">' +
                '<div class="flex flex-col gap-1 items-start">' +
                    '<span class="text-xs ml-1" style="color: var(--npc-text); opacity:.6;">' + CONFIG.npcName + '</span>' +
                    '<div class="px-4 py-3 rounded-2xl bubble-npc shadow-sm flex items-center gap-2" style="background-color: var(--npc-bubble);">' +
                        '<div class="think-spinner"></div>' +
                        '<div class="typing-indicator flex items-center h-4"><span></span><span></span><span></span></div>' +
                        '<span class="think-label">思考回應中…</span>' +
                    '</div>' +
                '</div>';
            chatContainer.appendChild(loadingEl);
            scrollToBottom();
        }
        function hideLoading() {
            if (loadingEl) { loadingEl.remove(); loadingEl = null; }
        }
        // 相容舊呼叫：loadingDiv.classList.remove/add('hidden')
        const loadingDiv = { classList: { remove(c){ if(c==='hidden') showLoading(); }, add(c){ if(c==='hidden') hideLoading(); } } };

        let chatHistory = [];
        let currentTurns = 0;
        // 功能3：記住第一個成功的模型，避免每次都重試
        let workingModel = (CONFIG.models && CONFIG.models[0]) || 'gemini-3-flash-preview';

        /* ===== 功能5：對話紀錄 (含絕對時間戳記)，存本機 localStorage「對話紀錄」 ===== */
        // 每個角色一個獨立的 key，避免不同 NPC 混在一起
        const LOG_KEY = '對話紀錄_' + (CONFIG.npcName || 'NPC');
        let chatLog = [];   // { ts: ISO字串, role: 'player'|'npc', name, text }
        function loadChatLog() {
            try {
                const raw = localStorage.getItem(LOG_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    chatLog = parsed.log || [];
                    // 還原對話脈絡，讓 API 有完整上下文 (功能5)
                    chatHistory = parsed.history || [];
                    currentTurns = parsed.turns || 0;
                }
            } catch(e){ console.warn('讀取對話紀錄失敗', e); }
        }
        function saveChatLog() {
            try {
                localStorage.setItem(LOG_KEY, JSON.stringify({ log: chatLog, history: chatHistory, turns: currentTurns }));
            } catch(e){ console.warn('儲存對話紀錄失敗', e); }
        }
        function logMessage(role, name, text) {
            chatLog.push({ ts: new Date().toISOString(), role: role, name: name, text: text });
            saveChatLog();
        }
        // 問題3：清空從頭對話（清畫面、紀錄、脈絡、次數，並移除本機儲存）
        function clearChat() {
            if (!confirm('確定要清空所有對話，從頭開始嗎？此動作無法復原。')) return;
            chatLog = [];
            chatHistory = [];
            currentTurns = 0;
            lastAnnouncedZone = null;      // GPS 抵達提示重置
            turnsSinceProactive = 0;
            proactivePending = false;
            try { localStorage.removeItem(LOG_KEY); } catch(e){}
            chatContainer.innerHTML = '';
            hideLoading();
            updateTurnsDisplay();
            userInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.style.opacity = '1';
            userInput.value = '';
            baseTextBeforeSpeech = '';
            // 重新顯示開場白
            const greeting = '哈囉！我是' + (CONFIG.npcName || 'NPC') + '👋 有什麼我可以幫忙的嗎？';
            appendMessage('model', greeting);
            logMessage('npc', CONFIG.npcName, greeting);
            showTip('已清空對話，重新開始！');
        }
        // 功能6：複製所有對話
        function copyChatLog() {
            const txt = chatLog.map(m => {
                const t = new Date(m.ts).toLocaleString();
                return '[' + t + '] ' + m.name + '：' + m.text;
            }).join('\n');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(() => showTip('已複製所有對話內容！')).catch(() => fallbackCopy(txt));
            } else fallbackCopy(txt);
        }
        function fallbackCopy(txt) {
            const ta = document.createElement('textarea');
            ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showTip('已複製所有對話內容！'); } catch(e){ showTip('複製失敗，請手動選取', true); }
            document.body.removeChild(ta);
        }
        // 功能6：匯出 CSV (含絕對時間戳記)
        function exportChatLogCSV() {
            const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
            let csv = '\uFEFF';   // BOM，讓 Excel 正確顯示中文
            csv += ['時間戳記(ISO)', '本地時間', '角色', '名稱', '內容'].map(esc).join(',') + '\n';
            chatLog.forEach(m => {
                csv += [m.ts, new Date(m.ts).toLocaleString(), (m.role === 'player' ? '玩家' : 'NPC'), m.name, m.text].map(esc).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '對話紀錄_' + (CONFIG.npcName || 'NPC') + '_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showTip('對話紀錄 CSV 已下載！');
        }
        // 小提示 (畫面上方短暫顯示)
        function showTip(msg, isErr) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:' + (isErr?'#ef4444':'#111827') + ';color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.2);';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        let lastAnnouncedZone = null;    // 上次已公告過抵達語的區域
        let gpsAccuracy = null;

        function setGpsStatus(text, show) {
            const el = document.getElementById('gpsStatus');
            if (!el) return;
            el.textContent = text;
            if (show === false) el.classList.add('hidden');
            else el.classList.remove('hidden');
        }
        function initGPS() {
            if (!CONFIG.gpsPoints || CONFIG.gpsPoints.length === 0) return;   // 沒設定定位點就不啟用
            if (!navigator.geolocation) { setGpsStatus('📍 裝置不支援定位'); return; }
            if (gpsStarted) return;       // 確保只呼叫一次 watchPosition -> 只請求一次授權
            gpsStarted = true;
            setGpsStatus('📍 定位中…');
            navigator.geolocation.watchPosition(
                (pos) => {
                    currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    gpsAccuracy = pos.coords.accuracy;
                    updateCurrentZone();
                    refreshGpsStatus();
                },
                (err) => {
                    let msg = '📍 無法定位';
                    if (err.code === 1) msg = '📍 定位被拒絕';
                    else if (err.code === 2) msg = '📍 定位不可用';
                    else if (err.code === 3) msg = '📍 定位逾時';
                    setGpsStatus(msg);
                    console.warn("GPS 錯誤:", err.code, err.message);
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
            );
        }
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
        function findZone() {
            if (!currentPosition || !CONFIG.gpsPoints) return null;
            for (const p of CONFIG.gpsPoints) {
                const dist = haversine(currentPosition.lat, currentPosition.lng, p.lat, p.lng);
                if (dist <= p.radius) return p;
            }
            return null;
        }
        // 找出最近的定位點與距離（診斷用）
        function nearestPoint() {
            if (!currentPosition || !CONFIG.gpsPoints || !CONFIG.gpsPoints.length) return null;
            let best = null, bestDist = Infinity;
            for (const p of CONFIG.gpsPoints) {
                const d = haversine(currentPosition.lat, currentPosition.lng, p.lat, p.lng);
                if (d < bestDist) { bestDist = d; best = p; }
            }
            return { point: best, dist: bestDist };
        }
        function updateCurrentZone() {
            const zone = findZone();
            currentZoneName = zone ? zone.name : null;
            // 離開所有區域就重置公告狀態，之後再進入（同一或不同區域）會重新提示
            if (!currentZoneName) lastAnnouncedZone = null;
        }
        function refreshGpsStatus() {
            if (currentZoneName) {
                setGpsStatus('📍 ' + currentZoneName + '（範圍內）');
            } else {
                const near = nearestPoint();
                if (near) {
                    const d = Math.round(near.dist);
                    setGpsStatus('📍 已定位（最近：' + near.point.name + ' ' + (d >= 1000 ? (d/1000).toFixed(1)+'km' : d+'m') + '）');
                } else {
                    setGpsStatus('📍 已定位');
                }
            }
        }
        // 抵達語只在「第一次進入」或「離開後再回到」時給
        function consumeArrivalMessage() {
            if (currentZoneName && currentZoneName !== lastAnnouncedZone) {
                const zone = CONFIG.gpsPoints.find(p => p.name === currentZoneName);
                lastAnnouncedZone = currentZoneName;
                return (zone && zone.arrival) ? zone.arrival : "";
            }
            if (!currentZoneName) lastAnnouncedZone = null;  // 離開後重置，再進入會再提示
            return "";
        }
        // 點狀態徽章可看詳細診斷
        function showGpsDiag() {
            if (!CONFIG.gpsPoints || !CONFIG.gpsPoints.length) { showTip('未設定任何 GPS 定位點'); return; }
            if (!currentPosition) { showTip('尚未取得定位，請確認已允許定位權限', true); return; }
            let lines = '目前座標：' + currentPosition.lat.toFixed(6) + ', ' + currentPosition.lng.toFixed(6);
            if (gpsAccuracy) lines += '（誤差約 ' + Math.round(gpsAccuracy) + 'm）';
            lines += '\n\n各定位點距離：\n';
            CONFIG.gpsPoints.forEach(p => {
                const d = Math.round(haversine(currentPosition.lat, currentPosition.lng, p.lat, p.lng));
                const inRange = d <= p.radius;
                lines += '• ' + p.name + '：' + (d >= 1000 ? (d/1000).toFixed(2)+'km' : d+'m') + ' / 半徑' + p.radius + 'm ' + (inRange ? '✅在範圍內' : '') + '\n';
            });
            alert(lines);
        }

        /* ===== 功能4：圖片放大 lightbox ===== */
        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('show');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('show');
        }

        /* ===== 語音 (TTS / STT) ===== */
        let ttsOn = CONFIG.tts && CONFIG.tts.enabled;
        let chosenVoice = null;
        function pickVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;
            // 優先使用設計者指定的語音
            if (CONFIG.tts && CONFIG.tts.voice) {
                chosenVoice = voices.find(v => v.name === CONFIG.tts.voice);
            }
            // 自動偵測：退回中文語音
            if (!chosenVoice) chosenVoice = voices.find(v => /zh|cmn|Chinese|Taiwan|Mandarin/i.test(v.lang + v.name));
            // 再退回系統預設
            if (!chosenVoice) chosenVoice = voices.find(v => v.default) || voices[0];
        }
        if ('speechSynthesis' in window) {
            pickVoice();
            window.speechSynthesis.onvoiceschanged = pickVoice;
        }
        function speak(text) {
            if (!ttsOn || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const clean = text.replace(/https?:\S+/g, '').replace(/[#*_>`]/g, '');
            const u = new SpeechSynthesisUtterance(clean);
            if (chosenVoice) u.voice = chosenVoice;
            u.lang = chosenVoice ? chosenVoice.lang : 'zh-TW';
            u.rate = CONFIG.tts?.rate || 1;
            u.pitch = CONFIG.tts?.pitch || 1;
            window.speechSynthesis.speak(u);
        }
        function toggleTTS() {
            ttsOn = !ttsOn;
            const btn = document.getElementById('ttsToggle');
            btn.textContent = ttsOn ? '🔊 語音' : '🔇 靜音';
            btn.style.opacity = ttsOn ? '1' : '0.55';
            if (!ttsOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // 語音輸入
        let recognition = null;
        let recognizing = false;
        let baseTextBeforeSpeech = '';   // 錄音前已有的文字，語音接在後面而非覆蓋
        let micStream = null;     // 持有一次授權後的麥克風串流，避免重複詢問
        let micDenied = false;
        let justSent = false;     // 問題2：剛送出訊息，忽略殘留的語音結果、不回填輸入框
        function initSTT() {
            if (!CONFIG.sttEnabled) return;
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('micBtn');
            if (!SR) return;                     // 裝置不支援則不顯示按鈕
            micBtn.classList.remove('hidden');
            recognition = new SR();              // 只建立一個實例
            recognition.lang = 'zh-TW';
            recognition.interimResults = true;
            recognition.continuous = true;       // 持續辨識，一次 session 直到玩家再按一次
            recognition.onresult = (e) => {
                if (justSent) return;            // 送出後不再回填殘留結果
                let finalText = '';
                let interim = '';
                for (let i = 0; i < e.results.length; i++) {
                    if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }
                const prefix = baseTextBeforeSpeech ? (baseTextBeforeSpeech.replace(/\s*$/, '') + ' ') : '';
                userInput.value = prefix + finalText + interim;   // 接續，不覆蓋
                userInput.dispatchEvent(new Event('input'));
            };
            recognition.onend = () => {
                recognizing = false;
                micBtn.classList.remove('mic-recording');
                if (justSent) {
                    // 送出後結束：徹底清空，下次錄音從頭開始
                    baseTextBeforeSpeech = '';
                    justSent = false;
                } else {
                    baseTextBeforeSpeech = userInput.value;   // 未送出：保留結果方便下次接續
                }
            };
            recognition.onerror = (ev) => {
                recognizing = false;
                micBtn.classList.remove('mic-recording');
                if (ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed')) micDenied = true;
            };

            // 只請求一次麥克風授權：先用 getUserMedia 取得並「持有」串流
            async function ensureMicPermission() {
                if (micStream) return true;           // 已經授權過，直接沿用
                if (micDenied) return true;           // 已被拒絕就不再一直問，交給辨識自己處理
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    return true;
                } catch(err) {
                    micDenied = true;
                    return false;
                }
            }

            micBtn.addEventListener('click', async () => {
                if (recognizing) {
                    recognition.stop();
                    return;
                }
                const ok = await ensureMicPermission();
                if (!ok) { showTip('無法使用麥克風，請在瀏覽器允許麥克風權限', true); return; }
                justSent = false;
                baseTextBeforeSpeech = userInput.value;   // 保留目前已打的字（若剛送出則為空）
                try { recognition.start(); recognizing = true; micBtn.classList.add('mic-recording'); } catch(e){}
            });
        }

        window.onload = () => {
            document.getElementById('profileBio').innerText = CONFIG.npcBio || '這個人很神秘，沒有留下簡介。';
            loadChatLog();               // 功能5：讀回本機對話紀錄與脈絡
            updateTurnsDisplay();
            initGPS();
            initSTT();
            if (CONFIG.tts && CONFIG.tts.enabled) document.getElementById('ttsToggle').classList.remove('hidden');
            // 功能6：依設定顯示匯出/複製按鈕
            if (CONFIG.allowExportLog) document.getElementById('exportLogBtn').classList.remove('hidden');
            if (CONFIG.allowCopyLog) document.getElementById('copyLogBtn').classList.remove('hidden');

            // 功能5：若有歷史紀錄則重播，否則顯示開場白
            if (chatLog.length > 0) {
                chatLog.forEach(m => { appendMessage(m.role === 'player' ? 'user' : 'model', m.text, null, true); });
            } else {
                const greeting = '哈囉！我是' + (CONFIG.npcName || 'NPC') + '👋 有什麼我可以幫忙的嗎？';
                appendMessage('model', greeting);
                logMessage('npc', CONFIG.npcName, greeting);
            }
            startProactive();            // 功能7
        };

        /* ===== 功能7：主動發言 ===== */
        let turnsSinceProactive = 0;
        let proactiveTimer = null;
        let proactiveBusy = false;
        let proactivePending = false;   // 累積句數已達標，等玩家這輪回覆結束後觸發
        function startProactive() {
            const p = CONFIG.proactive;
            if (!p || !p.enabled) return;
            if (p.minutes && p.minutes > 0) {
                proactiveTimer = setInterval(() => { maybeProactive(); }, p.minutes * 60 * 1000);
            }
        }
        // 玩家每發一句就 +1；達標時標記 pending（實際發言等回覆結束再做）
        function noteTurnForProactive() {
            const p = CONFIG.proactive;
            if (!p || !p.enabled || !p.turns || p.turns <= 0) return;
            turnsSinceProactive++;
            if (turnsSinceProactive >= p.turns) { turnsSinceProactive = 0; proactivePending = true; }
        }
        async function maybeProactive() {
            const p = CONFIG.proactive;
            if (!p || !p.enabled) return;
            if (proactiveBusy) return;
            if (currentTurns >= CONFIG.maxTurns) return;
            if (sendBtn.disabled) return;   // 玩家正在等回覆時不插話（改由回覆結束後再觸發）
            proactiveBusy = true;
            proactivePending = false;
            turnsSinceProactive = 0;        // 重置句數計時
            showLoading();
            scrollToBottom();
            try {
                const instr = '【主動發言指示】現在請你「主動」對玩家說一句話（玩家沒有發問）。請根據目前的對話紀錄與以下方向來說：' + (p.prompt || '主動關心玩家目前的進度。') + ' 一樣遵守你原本的角色設定與回答原則。';
                await fetchGeminiResponse(instr, [], "", true);
            } catch(e) {
                console.warn('主動發言失敗', e);
            } finally {
                hideLoading();
                proactiveBusy = false;
            }
        }

        function showProfile() {
            const modal = document.getElementById('profileModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.firstElementChild.classList.remove('scale-95'); }, 10);
        }
        function hideProfile() {
            const modal = document.getElementById('profileModal');
            modal.classList.add('opacity-0'); modal.firstElementChild.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        function updateTurnsDisplay() {
            const remaining = CONFIG.maxTurns - currentTurns;
            document.getElementById('turnsDisplay').innerText = `剩餘互動: ${Math.max(0, remaining)}`;
            if (remaining <= 0) {
                userInput.disabled = true;
                userInput.placeholder = '遊戲對話次數已用盡';
                sendBtn.disabled = true;
                sendBtn.style.opacity = '0.5';
                showError("您已經達到這趟旅程的最大問答次數限制囉！感謝遊玩。");
            }
        }

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value.trim() === '') this.style.height = '44px';
        });
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        sendBtn.addEventListener('click', sendMessage);

        function showError(msg) {
            document.getElementById('errorMsg').innerText = msg;
            const modal = document.getElementById('errorModal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
        }

        function formatTime() {
            const now = new Date();
            let hours = now.getHours();
            const ampm = hours >= 12 ? '下午' : '上午';
            hours = hours % 12 || 12;
            const minutes = now.getMinutes().toString().padStart(2, '0');
            return `${ampm} ${hours}:${minutes}`;
        }

        // 偵測要附加的圖片 (功能2)
        function detectImages(text) {
            if (!CONFIG.imageResources) return [];
            const found = [];
            CONFIG.imageResources.forEach(res => {
                if (res.keywords.some(k => k && text.includes(k))) found.push(res);
            });
            return found;
        }

        async function appendMessage(role, text, images, skipTypewriter) {
            const timeStr = formatTime();
            const div = document.createElement('div');

            if (role === 'user') {
                div.className = 'flex flex-col items-end gap-1 mb-3';
                div.innerHTML = `
                    <div class="flex items-end gap-1 max-w-[85%]">
                        <span class="text-[10px] text-gray-500 mb-1 ml-1 whitespace-nowrap">${timeStr}</span>
                        <div class="px-4 py-2.5 rounded-2xl bubble-user shadow-sm chat-bubble chat-content" style="background-color: var(--user-bubble); color: var(--user-text);"></div>
                    </div>
                `;
            } else {
                div.className = 'flex flex-col items-start gap-1 mb-3';
                div.innerHTML = `
                    <div class="flex items-start gap-2 max-w-[85%]">
                        <img src="${CONFIG.npcAvatar}" class="w-10 h-10 rounded-full object-cover shadow-sm flex-shrink-0 mt-1 cursor-pointer" onclick="showProfile()">
                        <div class="flex flex-col gap-1 items-start">
                            <span class="text-xs text-gray-500 ml-1" style="color: var(--npc-text); opacity:.6;">${CONFIG.npcName}</span>
                            <div class="flex items-end gap-1">
                                <div class="px-4 py-2.5 rounded-2xl bubble-npc shadow-sm chat-bubble chat-content" style="background-color: var(--npc-bubble); color: var(--npc-text);"></div>
                                <span class="text-[10px] text-gray-500 mb-1 ml-1 whitespace-nowrap">${timeStr}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            chatContainer.appendChild(div);
            const contentDiv = div.querySelector('.chat-content');

            // 圖片附加函式 (功能2 + 功能4：點圖放大)
            const attachImages = () => {
                if (images && images.length) {
                    images.forEach(res => {
                        const img = document.createElement('img');
                        img.src = res.url;
                        img.className = 'chat-img';
                        img.onerror = () => img.remove();
                        img.addEventListener('click', () => openLightbox(res.url));
                        contentDiv.appendChild(img);
                    });
                    scrollToBottom();
                }
            };

            if (role === 'model' && CONFIG.typewriterEnabled && !skipTypewriter) {
                return new Promise(resolve => {
                    let i = 0;
                    const speed = CONFIG.typewriterSpeed;
                    const interval = setInterval(() => {
                        if (i < text.length) {
                            const char = text.charAt(i);
                            if (char === '\n') contentDiv.appendChild(document.createElement('br'));
                            else contentDiv.appendChild(document.createTextNode(char));
                            i++;
                            scrollToBottom();
                        } else {
                            clearInterval(interval);
                            attachImages();
                            resolve();
                        }
                    }, speed);
                });
            } else {
                const parts = text.split('\n');
                parts.forEach((part, idx) => {
                    contentDiv.appendChild(document.createTextNode(part));
                    if (idx < parts.length - 1) contentDiv.appendChild(document.createElement('br'));
                });
                attachImages();
                scrollToBottom();
                return Promise.resolve();
            }
        }

        function scrollToBottom() {
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 10);
        }

        async function sendMessage() {
            if (currentTurns >= CONFIG.maxTurns) return;
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = '44px';
            // 問題2：送出後徹底清掉語音暫存，下次錄音不保留上一句
            baseTextBeforeSpeech = '';
            justSent = true;
            if (recognizing && recognition) { try { recognition.stop(); } catch(e){} }
            sendBtn.disabled = true;

            await appendMessage('user', text);
            chatHistory.push({ role: "user", parts: [{ text: text }] });
            currentTurns++;
            logMessage('player', '玩家', text);   // 功能5：記錄玩家發言
            updateTurnsDisplay();
            noteTurnForProactive();               // 功能7：累計句數

            // 條件規則
            let customPrompt = "";
            let matchedRule = null;
            if (CONFIG.keywordRules && CONFIG.keywordRules.length > 0) {
                matchedRule = CONFIG.keywordRules.find(rule => text.includes(rule.keyword));
            }

            // 功能2：偵測圖片
            const imagesToShow = detectImages(text);
            let imgPrompt = "";
            if (imagesToShow.length) {
                imgPrompt = "【圖片資源提示】玩家的問題與以下圖片有關，你的回答需自然地呼應這些圖片內容（系統會自動把圖片附在你的訊息下方，你只要用文字帶到即可，不要輸出網址）：\n"
                    + imagesToShow.map(r => '- ' + r.desc).join('\n');
            }

            // 功能6：抵達語只在進入/再進入時給；引導方向持續套用
            const gpsArrivalMsg = consumeArrivalMessage();
            let gpsPrompt = "";
            if (currentZoneName) {
                const zone = CONFIG.gpsPoints.find(p => p.name === currentZoneName);
                if (zone && zone.guide) gpsPrompt = '【定位引導方向】玩家目前實際位於「' + zone.name + '」範圍內。在遵守你原本所有回答原則的前提下，額外套用此引導：' + zone.guide;
            }

            loadingDiv.classList.remove('hidden');
            scrollToBottom();

            if (matchedRule && matchedRule.type === 'fixed') {
                setTimeout(async () => {
                    loadingDiv.classList.add('hidden');
                    if (gpsArrivalMsg) {
                        await appendMessage('model', gpsArrivalMsg);
                        chatHistory.push({ role: "model", parts: [{ text: gpsArrivalMsg }] });
                        logMessage('npc', CONFIG.npcName, gpsArrivalMsg);
                        speak(gpsArrivalMsg);
                    }
                    await appendMessage('model', matchedRule.content, imagesToShow);
                    chatHistory.push({ role: "model", parts: [{ text: matchedRule.content }] });
                    logMessage('npc', CONFIG.npcName, matchedRule.content);
                    speak(matchedRule.content);
                    sendBtn.disabled = (currentTurns >= CONFIG.maxTurns);
                    userInput.focus();
                    if (proactivePending && currentTurns < CONFIG.maxTurns) {
                        setTimeout(() => { maybeProactive(); }, 700);
                    }
                }, 800);
                return;
            } else if (matchedRule && matchedRule.type === 'prompt') {
                customPrompt = matchedRule.content;
            }

            // 組合本次動態指示
            const combinedPrompt = [customPrompt, imgPrompt, gpsPrompt].filter(Boolean).join('\n\n');

            try {
                await fetchGeminiResponse(combinedPrompt, imagesToShow, gpsArrivalMsg);
            } catch (error) {
                console.error("API 錯誤:", error);
                loadingDiv.classList.add('hidden');
                // 功能3：所有可用模型都失敗才提示重新整理
                showError("目前所有可用的 AI 模型都暫時連不上 😢\n請稍後再試，或重新整理網頁後再試一次。");
                chatHistory.pop();
                currentTurns--;
                updateTurnsDisplay();
            } finally {
                sendBtn.disabled = (currentTurns >= CONFIG.maxTurns);
                userInput.focus();
                // 問題1：玩家這輪回覆結束後，若句數已達標就主動追加發言
                if (proactivePending && currentTurns < CONFIG.maxTurns) {
                    setTimeout(() => { maybeProactive(); }, 700);
                }
            }
        }

        // 呼叫單一模型（含 429 稍候重試一次同模型）
        async function callModel(model, payload) {
            const apiUrl = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + CONFIG.apiKey;
            let response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.status === 429) {
                await new Promise(r => setTimeout(r, 1200));
                response = await fetch(apiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            }
            if (!response.ok) {
                const e = await response.json().catch(() => ({}));
                throw new Error((e.error && e.error.message) || ('HTTP ' + response.status));
            }
            return response.json();
        }

        // 功能3：自動嘗試多個模型，直到成功；全部失敗才 throw
        async function fetchGeminiResponse(customPrompt, imagesToShow, gpsArrivalMsg, isProactive) {
            let finalSystemPrompt = CONFIG.systemPrompt;
            if (customPrompt) finalSystemPrompt += '\n\n【最高優先級動態指示(僅限本次對話生效)】：\n' + customPrompt;

            // 功能5：完整帶入對話脈絡；功能7：主動發言時補一個引導用的 user turn（不寫入正式紀錄）
            let contents = chatHistory.slice();
            if (isProactive) {
                contents = contents.concat([{ role: "user", parts: [{ text: "(系統：請依上方主動發言指示，主動對玩家說一句話)" }] }]);
            } else if (contents.length === 0) {
                contents = [{ role: "user", parts: [{ text: "你好" }] }];
            }

            const payload = {
                contents: contents,
                systemInstruction: { parts: [{ text: finalSystemPrompt }] },
                generationConfig: { temperature: CONFIG.temperature }
            };

            // 把上次成功的模型排最前，其餘依序 fallback
            const models = (CONFIG.models && CONFIG.models.length) ? CONFIG.models.slice() : [workingModel];
            const ordered = [workingModel].concat(models.filter(m => m !== workingModel));

            let result = null;
            let lastErr = null;
            for (const model of ordered) {
                try {
                    const r = await callModel(model, payload);
                    const cand = r.candidates && r.candidates[0];
                    if (cand && cand.content && cand.content.parts && cand.content.parts[0] && cand.content.parts[0].text) {
                        result = r;
                        workingModel = model;   // 記住這個可用模型，下次優先用
                        break;
                    } else {
                        lastErr = new Error('模型回傳空內容');   // 換下一個
                    }
                } catch (err) {
                    lastErr = err;                                // 換下一個
                }
            }

            loadingDiv.classList.add('hidden');
            if (!result) throw (lastErr || new Error('無可用模型'));

            const botReply = result.candidates[0].content.parts[0].text;
            // 功能6：先送出抵達引導語 (固定文字)
            if (gpsArrivalMsg) {
                await appendMessage('model', gpsArrivalMsg);
                chatHistory.push({ role: "model", parts: [{ text: gpsArrivalMsg }] });
                logMessage('npc', CONFIG.npcName, gpsArrivalMsg);
                speak(gpsArrivalMsg);
            }
            await appendMessage('model', botReply, imagesToShow);
            chatHistory.push({ role: "model", parts: [{ text: botReply }] });
            logMessage('npc', CONFIG.npcName, botReply);   // 功能5：記錄 NPC 發言
            speak(botReply);
        }
    </script>
